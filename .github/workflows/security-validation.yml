name: Security validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/milestone-4-security
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-and-client:
    name: Build, test, format, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/packages.lock.json
            **/*.csproj

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/ChopChop.Client/package-lock.json

      - name: Restore .NET
        run: dotnet restore Solution.sln

      - name: Build .NET in Release
        run: dotnet build Solution.sln -c Release --no-restore

      - name: Verify .NET formatting
        run: dotnet format Solution.sln --verify-no-changes --no-restore

      - name: Run .NET unit tests
        shell: bash
        run: |
          set -euo pipefail
          for project in tests/*UnitTests/*.csproj; do
            dotnet test "$project" -c Release --no-build --logger "console;verbosity=minimal"
          done

      - name: Audit .NET dependencies
        run: dotnet list Solution.sln package --vulnerable --include-transitive

      - name: Install client dependencies
        working-directory: src/ChopChop.Client
        run: npm ci

      - name: Build client
        working-directory: src/ChopChop.Client
        run: npm run build

      - name: Test client
        working-directory: src/ChopChop.Client
        run: npm test

      - name: Lint client
        working-directory: src/ChopChop.Client
        run: npm run lint

      - name: Audit production client dependencies
        working-directory: src/ChopChop.Client
        run: npm audit --omit=dev

  sql-integration:
    name: SQL-backed integration tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    needs: dotnet-and-client
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQLSERVER_PASSWORD }}
          SQLCMDPASSWORD: ${{ secrets.CI_SQLSERVER_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_SQLSERVER_CONNECTION: Server=127.0.0.1,1433;User Id=sa;Password=${{ secrets.CI_SQLSERVER_PASSWORD }};Encrypt=True;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require the integration database secret
        shell: bash
        env:
          CI_SQLSERVER_PASSWORD: ${{ secrets.CI_SQLSERVER_PASSWORD }}
        run: |
          if [ -z "$CI_SQLSERVER_PASSWORD" ]; then
            echo "::error::Configure the CI_SQLSERVER_PASSWORD repository Actions secret."
            exit 1
          fi

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/packages.lock.json
            **/*.csproj

      - name: Restore .NET
        run: dotnet restore Solution.sln

      - name: Build .NET in Release
        run: dotnet build Solution.sln -c Release --no-restore

      - name: Run SQL-backed integration tests
        shell: bash
        run: |
          set -euo pipefail
          for project in tests/*IntegrationTests/*.csproj tests/Pantry.Tests/*.csproj; do
            dotnet test "$project" -c Release --no-build --logger "console;verbosity=minimal"
          done
