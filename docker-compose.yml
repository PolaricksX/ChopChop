services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chopchop-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "ChopChop_dev_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - chopchop-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ChopChop_dev_2026! -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chopchop-sqlserver-data:
